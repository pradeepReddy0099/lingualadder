{% extends "base.html" %}{% block body %}
<section class="hero"><h1>{{ t('home_h1') }}</h1>
<p>{{ t('home_p') }}</p></section>
<form method="post" class="card profile">
 <h2>{{ t('profile_h') }}</h2>
 <label>{{ t('learning') }} <select name="target">{% for c,n in LANGUAGES.items() %}{% if c in stats %}<option value="{{c}}" {% if profile and profile.target==c %}selected{% endif %}>{{ lname(c,n) }} ({{stats[c]}} {{ t('articles') }})</option>{% endif %}{% endfor %}</select></label>
 <label>{{ t('native') }} <select name="native">{% for c,n in NATIVE.items() %}<option value="{{c}}" {% if (profile and profile.native==c) or (not profile and c==ui) %}selected{% endif %}>{{ lname(c,n) }}</option>{% endfor %}</select></label>
 <label>{{ t('level') }} <select name="level">{% for k,v in LEVELS.items() %}<option value="{{k}}" {% if profile and profile.level==k %}selected{% endif %}>{{ t('lv_' ~ k) }}</option>{% endfor %}</select></label>
 <button>{{ t('save') }}</button>
 {% if profile %}<a class="btn" style="margin-left:8px;background:#eef3f8;color:#1f4e79" href="{{ url_for('placement', restart=1) }}">{{ t('place_link') }}</a>{% endif %}
</form>
<section class="card"><h2>{{ t('topics_h') }}</h2><p class="topics">{% for tp in topics %}<span>{{tp}}</span>{% endfor %}</p></section>
{% endblock %}
